name: Release Spice Native

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prepare-native-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure GitHub Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            exit 0
          fi
          if gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes; then
            exit 0
          fi
          echo "Release creation raced with another workflow; verifying the shared release now exists."
          gh release view "$VERSION" >/dev/null

  build-native-windows:
    needs: prepare-native-release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install unified workspace
        run: npm ci

      - name: Build & Publish Native Release
        run: npm run dist:native:windows -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-native-linux:
    needs: prepare-native-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Linux package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install unified workspace
        run: npm ci

      - name: Build & Publish Native Linux Release
        run: npm run dist:native:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-native-macos:
    needs: prepare-native-release
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install unified workspace
        run: npm ci

      - name: Build and publish universal Native macOS release
        run: npm run dist:native:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Intel and Apple Silicon Native slices
        run: |
          APP_ROOT='dist-native/mac-universal/Spice Native.app'
          APP_EXECUTABLE="$APP_ROOT/Contents/MacOS/Spice Native"
          RUNTIME_FFMPEG="$APP_ROOT/Contents/Resources/native-runtime/spice-local-macos/node_modules/ffmpeg-static/ffmpeg"
          ARCHITECTURES="$(lipo -archs "$APP_EXECUTABLE")"
          FFMPEG_ARCHITECTURES="$(lipo -archs "$RUNTIME_FFMPEG")"
          [[ "$ARCHITECTURES" == *x86_64* ]]
          [[ "$ARCHITECTURES" == *arm64* ]]
          [[ "$FFMPEG_ARCHITECTURES" == *x86_64* ]]
          [[ "$FFMPEG_ARCHITECTURES" == *arm64* ]]
